<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DTA To-Do List</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="todo-app">
    <div class="header">
      <h1>My Tasks</h1>
      <p>Organize your day - DTA Style</p>
    </div>

    <div class="input-box">
      <input type="text" placeholder="Add a new task... e.g. Finish DTA project">
      <button>Add</button>
    </div>

    <div class="stats">
      <span>3 Tasks</span>
      <span>1 Completed</span>
    </div>

    <ul class="task-list">
      <li class="task completed">
        <label>
          <input type="checkbox" checked>
          <span class="checkmark"></span>
          <span class="text">Complete age validator project</span>
        </label>
        <button class="delete">✕</button>
      </li>

      <li class="task">
        <label>
          <input type="checkbox">
          <span class="checkmark"></span>
          <span class="text">Upload weather app to GitHub</span>
        </label>
        <button class="delete">✕</button>
      </li>

      <li class="task">
        <label>
          <input type="checkbox">
          <span class="checkmark"></span>
          <span class="text">Study JavaScript for DTA exam</span>
        </label>
        <button class="delete">✕</button>
      </li>

      <li class="task">
        <label>
          <input type="checkbox">
          <span class="checkmark"></span>
          <span class="text">Register on dta.education.gov.ng</span>
        </label>
        <button class="delete">✕</button>
      </li>
    </ul>

    <div class="footer">
      <button class="clear">Clear Completed</button>
    </div>
  </div>

</body>
</html>
