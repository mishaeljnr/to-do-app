<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DTA To-Do List</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="todo-app">
    <div class="header">
      <h1>My Tasks</h1>
      <p>Organize your day - DTA Style</p>
    </div>

    <div class="input-box">
      <input type="text" id="taskInput" placeholder="Add a new task... e.g. Finish DTA project">
      <button id="addBtn">Add</button>
    </div>

    <div class="stats">
      <span id="totalCount">0 Tasks</span>
      <span id="completedCount">0 Completed</span>
    </div>

    <ul class="task-list" id="taskList"></ul>

    <div class="footer">
      <button class="clear" id="clearBtn">Clear Completed</button>
    </div>

    <p id="empty" class="empty">No tasks yet. Add one above 👆</p>
  </div>

  <script src="index.js"></script>
</body>
</html>
